<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OxidePDF</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>OxidePDF</h1>
<div id="app">
  <div class="col" id="c1">
    <div class="col-title">Family</div>
    <div id="families"></div>
    <div id="wf-entry">
      <div class="item" id="wf-toggle">⚙ Workflow</div>
    </div>
  </div>
  <div class="col" id="c2">
    <div id="c2-single">
      <div class="col-title">Operation</div>
      <div id="ops"></div>
    </div>
    <div id="c2-workflow" style="display:none">
      <div class="col-title">Workflow</div>
      <div style="padding:.4rem .5rem"><button class="btn-sm" id="btn-add-step">＋ Add step</button></div>
      <div id="chain"></div>
      <div style="padding:.5rem"><button class="btn-primary" id="btn-exec-wf">Execute Workflow</button></div>
    </div>
  </div>
  <div id="c3">
    <div id="file-row">
      <button class="btn-sm" id="btn-upload">⬆ Upload</button>
      <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.svg" multiple hidden>
      <div id="file-select">
        <button class="btn-sm" id="file-dropdown-btn">Files ▾</button>
        <div id="file-list"></div>
      </div>
      <a id="dl-btn" class="btn-sm" style="visibility:hidden" download="result">⬇ Download output</a>
    </div>

    <div id="op-panel" style="display:none">
      <div class="section-label" id="op-title"></div>
      <div id="form-fields"></div>
      <div style="display:flex;gap:.5rem;margin-top:.4rem">
        <button class="btn-primary" id="btn-single">Execute</button>
        <button class="btn-sm" id="btn-add-to-wf" style="display:none">Add to workflow</button>
      </div>
    </div>

    <div id="error-msg" class="error"></div>
    <div id="preview-area"><span class="placeholder">Upload and select a file to preview</span></div>
  </div>
</div>

<div id="op-picker">
  <div class="panel">
    <h3>Add a step</h3>
    <div id="picker-body"></div>
    <div style="text-align:right;margin-top:.5rem"><button class="btn-sm" id="picker-close">Cancel</button></div>
  </div>
</div>

<script src="/static/form.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
