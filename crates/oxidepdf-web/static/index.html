<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OxidePDF</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <h1>OxidePDF</h1>
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" class="lang-btn active" data-lang="en">EN</button>
    <button type="button" class="lang-btn" data-lang="zh">中文</button>
  </div>
</header>
<div id="app">
  <div class="col" id="c1">
    <div class="col-title" data-i18n="family">Family</div>
    <div id="families"></div>
    <div id="wf-entry">
      <div class="item" id="wf-toggle" data-i18n="workflowMode">Workflow</div>
    </div>
  </div>
  <div class="col" id="c2">
    <div id="c2-single">
      <div class="col-title" data-i18n="operation">Operation</div>
      <div id="ops"></div>
    </div>
    <div id="c2-workflow" style="display:none">
      <div class="col-title" data-i18n="workflow">Workflow</div>
      <div style="padding:.4rem .5rem"><button class="btn-sm" id="btn-add-step" data-i18n="addStep">Add step</button></div>
      <div id="chain"></div>
      <div style="padding:.5rem"><button class="btn-primary" id="btn-exec-wf" data-i18n="executeWorkflow">Execute Workflow</button></div>
    </div>
  </div>
  <div id="c3">
    <div id="file-row">
      <button class="btn-sm btn-upload" id="btn-upload" data-i18n="upload">Upload</button>
      <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.svg" multiple hidden>
      <div id="file-select">
        <button class="btn-sm" id="file-dropdown-btn" data-i18n="files">Files</button>
        <div id="file-list"></div>
      </div>
      <a id="dl-btn" class="btn-sm" style="visibility:hidden" download="result" data-i18n="downloadOutput">Download output</a>
    </div>

    <div id="op-panel" style="display:none">
      <div class="section-label" id="op-title"></div>
      <div id="form-fields"></div>
      <div style="display:flex;gap:.5rem;margin-top:.4rem">
        <button class="btn-primary" id="btn-single" data-i18n="execute">Execute</button>
        <button class="btn-sm" id="btn-add-to-wf" style="display:none" data-i18n="addToWorkflow">Add to workflow</button>
      </div>
    </div>

    <div id="error-msg" class="error"></div>
    <div id="preview-area" class="is-empty">
      <div class="drop-zone" aria-live="polite">
        <svg class="drop-icon" viewBox="0 0 96 96" aria-hidden="true">
          <defs>
            <linearGradient id="drop-grad" x1="18" y1="12" x2="78" y2="84" gradientUnits="userSpaceOnUse">
              <stop stop-color="#14b8a6"/>
              <stop offset="1" stop-color="#2563eb"/>
            </linearGradient>
          </defs>
          <path d="M23 18h32l18 18v42a6 6 0 0 1-6 6H23a6 6 0 0 1-6-6V24a6 6 0 0 1 6-6Z" fill="#fff" stroke="url(#drop-grad)" stroke-width="3"/>
          <path d="M55 18v16a4 4 0 0 0 4 4h14" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
          <path d="M48 62V42m0 0-9 9m9-9 9 9" fill="none" stroke="url(#drop-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M34 70h28" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="drop-title" data-i18n="emptyTitle">Drop files here or use Upload</div>
        <div class="drop-copy" data-i18n="emptyCopy">PDF, PNG, JPEG, and SVG files appear here after selection.</div>
      </div>
    </div>
  </div>
</div>

<div id="op-picker">
  <div class="panel">
    <h3 data-i18n="addStepTitle">Add a step</h3>
    <div id="picker-body"></div>
    <div style="text-align:right;margin-top:.5rem"><button class="btn-sm" id="picker-close" data-i18n="cancel">Cancel</button></div>
  </div>
</div>

<script src="/static/form.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
