[workspace]
members = [
    "crates/oxidepdf-core",
    "crates/oxidepdf-cli",
    "crates/oxidepdf-web",
]
resolver = "2"

# License is intentionally not set here: each crate declares its own SPDX
# license because they differ. The core library is Apache-2.0; the CLI and web
# front ends are GPL-3.0-or-later.
[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
apalis = "1.0.0-rc.9"
clap = { version = "4.6.1", features = ["derive", "env"] }
clap_complete = "4.6.5"
cms = { version = "0.2.3", features = ["builder", "std"] }
const-oid = "0.9.6"
der = { version = "0.7.10", features = ["alloc"] }
futures-util = "0.3.31"
hayro = "0.7.1"
oxidepdf-core = { path = "crates/oxidepdf-core" }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pem", "pkcs8", "sha256", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
schemars = "1.2.1"
serde_json = "1.0.145"
serde-saphyr = "0.0.27"
sha2 = "0.10.9"
signature = "2.2.0"
spki = "0.7.3"
thiserror = "2.0.18"
lopdf = { version = "0.41.0", default-features = false }
rand = "0.10.1"
rsa = { version = "0.9.10", default-features = false, features = ["std", "sha2"] }
pdf-extract = "0.10.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.27.0", default-features = false }
pdf-writer = "0.12.1"
svg2pdf = { version = "0.13.0", default-features = false }
usvg = { version = "0.45.1", default-features = false }
resvg = { version = "0.45.1", default-features = false }
fontdb = { version = "0.23.0", default-features = false, features = ["fs", "std"] }
skrifa = { version = "0.43.2", default-features = false, features = ["std"] }
read-fonts = { version = "0.40.1", default-features = false }
pem-rfc7468 = { version = "1.0.0", features = ["alloc"] }
x509-cert = { version = "0.2.5", features = ["builder"] }
zeroize = "1.9.0"
tiverse-mmap = "1.0.0"
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-auth = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
